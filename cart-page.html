<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase Cart</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f7f7f8;
      color: #090a0d;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1196px;
      min-height: 700px;
      margin: 57px auto;
      overflow: hidden;
      border-radius: 19px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
    }

    header {
      display: flex;
      align-items: center;
      height: 83px;
      padding: 0 115px;
      border-bottom: 1px solid #d9d9d9;
    }

    .brand { margin-right: 77px; font-size: 29px; font-weight: 700; letter-spacing: -1.3px; }
    nav { display: flex; gap: 32px; }
    nav a { color: inherit; font-size: 18px; text-decoration: none; }
    .header-actions { display: flex; align-items: center; gap: 23px; margin-left: auto; }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f0f0f2;
      font-size: 22px;
      cursor: pointer;
    }

    .search { background: transparent; font-size: 29px; }

    main { max-width: 968px; margin: 44px auto 90px; }
    h1 { margin: 0 0 28px; font-size: 31px; letter-spacing: -.8px; }
    .cart-layout { display: grid; grid-template-columns: minmax(540px, 616px) 322px; gap: 27px; align-items: start; }

    .cart-items { padding: 0 20px; border: 1px solid #d7d7d7; border-radius: 14px; }
    .cart-item { display: grid; grid-template-columns: 86px minmax(185px, 1fr) auto 28px; align-items: center; gap: 18px; min-height: 121px; border-bottom: 1px solid #dedede; }
    .cart-item:last-child { border-bottom: 0; }

    .product-image {
      display: grid;
      width: 86px;
      height: 86px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #ececef, #f7f7f8);
      font-size: 53px;
      filter: grayscale(1);
    }

    .product-name { margin: 0 0 7px; font-size: 18px; font-weight: 700; }
    .price { margin: 0; font-size: 18px; font-weight: 700; }

    .quantity { display: flex; align-items: center; gap: 17px; }
    .quantity button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid #d7d7dc;
      border-radius: 10px;
      background: #f2f2f4;
      font-size: 26px;
      font-weight: 300;
      cursor: pointer;
    }

    .quantity span { min-width: 11px; text-align: center; font-size: 18px; font-weight: 700; }
    .remove { border: 0; background: transparent; font-size: 32px; font-weight: 200; cursor: pointer; }

    .summary { padding: 28px 26px 25px; border-radius: 17px; background: linear-gradient(135deg, #f1f1f4, #e9eaee); }
    .summary h2 { margin: 0 0 25px; font-size: 24px; }
    .summary-row { display: flex; justify-content: space-between; margin: 0 0 16px; font-size: 18px; }
    .total { margin-top: 9px; padding-top: 15px; border-top: 1px solid #d4d4d7; font-size: 19px; font-weight: 700; }
    .checkout {
      width: 100%;
      height: 52px;
      margin-top: 13px;
      border: 0;
      border-radius: 12px;
      background: #356ac9;
      color: white;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue { display: inline-block; margin-top: 30px; color: inherit; font-size: 18px; font-weight: 600; text-decoration: none; }

    @media (max-width: 900px) {
      .page { margin: 0; border-radius: 0; box-shadow: none; }
      header { padding: 0 28px; }
      main { padding: 0 28px; }
      .cart-layout { grid-template-columns: 1fr; }
      .summary { max-width: 500px; }
    }

    @media (max-width: 600px) {
      header { height: auto; flex-wrap: wrap; gap: 17px; padding: 20px; }
      .brand { margin-right: auto; font-size: 25px; }
      nav { order: 3; width: 100%; justify-content: space-between; gap: 0; }
      nav a { font-size: 15px; }
      main { margin-top: 30px; padding: 0 16px 45px; }
      h1 { font-size: 28px; }
      .cart-items { padding: 0 12px; }
      .cart-item { grid-template-columns: 62px 1fr 25px; gap: 10px; padding: 12px 0; }
      .product-image { width: 62px; height: 62px; font-size: 38px; }
      .quantity { grid-column: 2; gap: 11px; }
      .quantity button { width: 32px; height: 32px; }
      .remove { grid-column: 3; grid-row: 1 / 3; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">ShopEase</div>
      <nav aria-label="Primary navigation">
        <a href="#">Home</a><a href="#">Products</a><a href="#">Cart</a><a href="#">Profile</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button search" type="button" aria-label="Search">⌕</button>
        <button class="icon-button" type="button" aria-label="Profile">♙</button>
      </div>
    </header>

    <main>
      <h1>Your Cart</h1>
      <div class="cart-layout">
        <section class="cart-items" aria-label="Shopping cart items">
          <article class="cart-item">
            <div class="product-image" aria-label="Wireless headphones">🎧</div>
            <div><p class="product-name">Wireless Headphones</p><p class="price">₹2,999</p></div>
            <div class="quantity"><button type="button">−</button><span>1</span><button type="button">+</button></div>
            <button class="remove" type="button" aria-label="Remove Wireless Headphones">×</button>
          </article>
          <article class="cart-item">
            <div class="product-image" aria-label="Smart watch">⌚</div>
            <div><p class="product-name">Smart Watch</p><p class="price">₹4,999</p></div>
            <div class="quantity"><button type="button">−</button><span>1</span><button type="button">+</button></div>
            <button class="remove" type="button" aria-label="Remove Smart Watch">×</button>
          </article>
          <article class="cart-item">
            <div class="product-image" aria-label="Backpack">🎒</div>
            <div><p class="product-name">Backpack</p><p class="price">₹1,499</p></div>
            <div class="quantity"><button type="button">−</button><span>1</span><button type="button">+</button></div>
            <button class="remove" type="button" aria-label="Remove Backpack">×</button>
          </article>
        </section>

        <aside class="summary">
          <h2>Order Summary</h2>
          <div class="summary-row"><span>Subtotal</span><span></span></div>
          <div class="summary-row"><span>Shipping</span><span>₹0</span></div>
          <div class="summary-row total"><span>Total</span><span></span></div>
          <button class="checkout" type="button">Proceed to Checkout</button>
        </aside>
      </div>
      <a class="continue" href="#">Continue Shopping</a>
    </main>
  </div>
</body>
</html>
